/* 定期手工检查mvnrepository版本，排除依赖漏洞 */
/* 更新检查命令：gradle dependencyUpdates -Drevision=release */
ext {
    springVersion = '4.1.1'
    /* spring[boot-cloud] 版本对应： https://start.spring.io/actuator/info */
    springCloudVersion = '2025.1.3'
    druidVersion = '1.2.28'
    lombokVersion = '1.18.48'
    mysqlVersion = '26.7.0'
    /* ------------------------------ */
    mybatisSpringVersion = '4.1.0'
    // mybatisTypehandlersVersion = '1.0.2'
    // jakartaAnnotationVersion = '3.0.0'
    commonsPool2Version = '2.13.1'
    commonsLang3Version = '3.21.0'
    commonsIoVersion = '2.22.0'
    commonsCodecVersion = '1.22.1'
    hutoolVersion = '5.8.47'
    bouncycastleVersion = '1.86'
    jschVersion = '2.28.7'
    caffeineVersion = '3.3.0'
    owaspVersion = '1.5.0'
}

def snippetsDir = layout.buildDirectory.dir('generated-snippets')

repositories {
    mavenCentral()
}
configurations {
    mybatisGenerator
}

/* 源码编译 */
java {
    toolchain {
        /* 指定jdk版本采用特性 */
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    /* 生成指定版本.class */
    options.release.set(25)
    /* 源码编译字符格式 */
    options.encoding = 'UTF-8'
}

/* 初始化配置块 还可定义配置名称等 */
configurations {
    /* 防止生产过程使用改项 */
    developmentOnly
    runtimeClasspath {
        extendsFrom developmentOnly
    }
    /* --------- */
    compileOnly {
        extendsFrom annotationProcessor
    }
}

configurations.configureEach {
    resolutionStrategy {
        /* 版本替换示例 */
        /*
       eachDependency {
           if (requested.group == 'org.yaml' && requested.name == 'snakeyaml') {
               useVersion(snakeyamlVersion)
           }
       }
        */
    }

    /* 漏洞处理 */
    if (!dependencieContains.contains('log4j')) {
        exclude group: 'org.apache.logging.log4j', module: 'log4j-api'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
        exclude group: 'org.apache.logging.log4j', module: 'log4j-slf4j-impl'
    }

    exclude group: 'org.bouncycastle', module: 'bcpkix-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
    exclude group: 'org.bouncycastle', module: 'bcutil-jdk15on'
}

/**
 * 包引入
 * api                 --> 当其他模块依赖于此模块时，此模块使用api声明的依赖包是可以被其他模块使用
 * implementation      --> 当其他模块依赖此模块时，此模块使用implementation声明的依赖包只限于模块内部使用，不允许其他模块使用
 * compileOnly         --> 依赖会添加到编译路径中，但是不会打包到apk中，因此只能在编译时访问，且compileOnly修饰的依赖不会传递
 * runtimeOnly         --> 与compileOnly相反，它修饰的依赖不会添加到编译路径中，但是被打包到apk中，运行时使用。
 * annotationProcessor --> 用于注解处理器的依赖配置
 **/
dependencies {
    /* spring */
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-aspectj"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    if (dependencieContains.contains('actuator')) {
        /* 健康检查 */
        implementation "org.springframework.boot:spring-boot-starter-actuator"
    }
    if (dependencieContains.contains('rabbitmq')) {
        /* springboot-rabbitmq */
        implementation "org.springframework.boot:spring-boot-starter-amqp"
    }
    /* redis */
    if (dependencieContains.contains('redis-lettuce')) {
        implementation "org.springframework.boot:spring-boot-starter-data-redis"
        implementation "org.springframework.boot:spring-boot-starter-data-redis-reactive"
        implementation "io.lettuce:lettuce-core"
    }
    /* spring-cloud */
    if (dependencieContains.contains('spring-cloud')) {
        /* Gradle 新版本支持 platform ; 不需要额外引入 io.spring.dependency-management 插件 */
        implementation platform("org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}")
        /* 配置中心，按需加载至项目 */
        implementation "org.springframework.cloud:spring-cloud-starter-config"
    }
    /* 连接池依赖 */
    if (dependencieContains.contains('mybatis-druid-mysql')) {
        implementation "org.mybatis.spring.boot:mybatis-spring-boot-starter:${mybatisSpringVersion}"
        // implementation "org.mybatis:mybatis-typehandlers-jsr310:${mybatisTypehandlersVersion}"
        implementation "jakarta.annotation:jakarta.annotation-api"
        implementation "com.alibaba:druid:${druidVersion}"
        // implementation "com.alibaba:druid-spring-boot-starter:${druidVersion}"
        runtimeOnly "com.mysql:mysql-connector-j:${mysqlVersion}"
    }
    /* jackson */
    if (dependencieContains.contains('jackson')) {
        implementation "tools.jackson.dataformat:jackson-dataformat-xml"
        implementation "tools.jackson.datatype:jackson-datatype-jsr310:3.0.0-rc2"
    }
    /* commons */
    implementation "org.apache.commons:commons-pool2:${commonsPool2Version}"
    implementation "org.apache.commons:commons-lang3:${commonsLang3Version}"
    implementation "commons-io:commons-io:${commonsIoVersion}"
    /* encoders, decoders */
    implementation "commons-codec:commons-codec:${commonsCodecVersion}"
    /* 工具类 */
    implementation "cn.hutool:hutool-all:${hutoolVersion}"
    /* 国密 */
    implementation "org.bouncycastle:bcprov-jdk18on:${bouncycastleVersion}"
    /* ssh2连接包 sftp */
    implementation "com.github.mwiede:jsch:${jschVersion}"
    /* 报文检查处理 */
    implementation "org.owasp.encoder:encoder:${owaspVersion}"
    /* lombok */
    compileOnly("org.projectlombok:lombok:${lombokVersion}")
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly("org.projectlombok:lombok:${lombokVersion}")
    testAnnotationProcessor("org.projectlombok:lombok:${lombokVersion}")
    /* 其他 */
    implementation "org.yaml:snakeyaml"
    implementation "com.github.ben-manes.caffeine:caffeine:${caffeineVersion}"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    /* ---------------- test ---------------------- */
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    /* -------------------------------------- */
}

/* ------------------------------------------------------------------------------- */

/* 生成Java类的HTML API文档 */
def javadocTask = tasks.named('javadoc', Javadoc)

tasks.named('javadoc', Javadoc) {
    enabled = true

    /* 默认值 */
    source sourceSets.main.allJava
    /* 生成文档的目标目录 */
    destinationDirectory.set(layout.buildDirectory.dir('docs'))
    /* 默认值 */
    classpath = sourceSets.main.compileClasspath
    /* 设置发生错误不会导致生成文档失败 */
    failOnError = true
    excludes = ['**/generated/**']

    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
    }

    doFirst {
        logger.lifecycle("-+-- 生成 Java类的HTML API文档 --+-")
    }
}

/* javadoc 打包 */
tasks.register('javadocJar', Jar) {
    dependsOn javadoc
    /* 指定生成的 jar 包名字 baseName rootProject.name + "-javadoc" */
    /* 分类器 archiveClassifier.set("javadoc") */
    archiveClassifier.set("javadoc")
    /* 设定需要打包的 class 文件路径 */
    /* from('build/intermediates/classes/debug/') */
    /* 设定需要打包的任务 from javadoc */
    from(javadocTask.flatMap { it.destinationDirectory })
    /* 排除 debug 目录下的 android 文件夹 */
    /* exclude('android/') */
    /* 去掉 R$ 开头的文件 */
    /* exclude { it.name.startsWith('R$'); } */
    /* 指定打包后的目录结构 */
    /* into('/') */
    doFirst {
        logger.lifecycle('-+-- 构建 Java类的HTML API JAR --+-')
    }
}

/* 构建 sources JAR */
tasks.register('sourcesJar', Jar) {
    /* 指定生成的 jar 包名字 baseName rootProject.name + "-sources" */
    /* 分类器 archiveClassifier.set("sources") */
    archiveClassifier.set("sources")
    /* 设定需要打包的任务 */
    from sourceSets.main.allSource
    from('build.gradle')
    excludes = ['**/*.yml']

    doFirst {
        logger.lifecycle("-+-- 构建 sources JAR --+-")
    }
}

/* 测试 */
tasks.named('test', Test) {
    useJUnitPlatform()
    outputs.dir(snippetsDir)

    testLogging {
        events 'PASSED', 'FAILED', 'SKIPPED'
        showStandardStreams = true
    }
}

